<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ultron</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0000" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  window.onerror = function(msg, url, line) {
    alert('JS ERROR: ' + msg + ' (line ' + line + ')');
  };
</script>
<style>
  :root {
    --bg: #0a0000;
    --bg-panel: #120303;
    --red: #dc2626;
    --red-glow: #ff3b3b;
    --red-dim: #7f1d1d;
    --text: #e8e0e0;
    --text-dim: #8a7373;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', ui-monospace, monospace;
    overflow: hidden;
  }
  body {
    background-image:
      radial-gradient(circle at 50% 0%, rgba(220,38,38,0.08), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--red-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .hamburger {
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    padding: 4px;
  }
  .hamburger span {
    width: 20px; height: 2px;
    background: var(--text);
  }
  .header-time {
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.4;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red-glow);
    box-shadow: 0 0 6px var(--red-glow), 0 0 14px var(--red);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  header h1 {
    font-size: 15px;
    letter-spacing: 0.12em;
    margin: 0;
    color: var(--red-glow);
    font-weight: 600;
    text-shadow: 0 0 10px rgba(220,38,38,0.5);
  }
  .signout-btn {
    background: none;
    border: 1px solid var(--red-dim);
    color: var(--text-dim);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  #hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 20px;
    text-align: center;
  }
  .core-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .core-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(220,38,38,0.25);
  }
  .ring1 { width: 220px; height: 220px; }
  .ring2 { width: 190px; height: 190px; }
  .core {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #ff5555, var(--red) 70%);
    box-shadow: 0 0 40px 10px rgba(220,38,38,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .core::after {
    content: '';
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 12px 4px rgba(255,255,255,0.8);
  }
  #hero h2 {
    color: var(--red-glow);
    letter-spacing: 0.14em;
    font-size: 18px;
    margin: 0;
    text-shadow: 0 0 10px rgba(220,38,38,0.5);
  }
  #hero p {
    color: var(--text-dim);
    font-size: 15px;
    max-width: 300px;
    margin: 0;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .msg {
    max-width: 90%;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    animation: rise 0.35s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: rgba(220, 38, 38, 0.12);
    border: 1px solid var(--red-dim);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .msg.ultron {
    align-self: flex-start;
    color: var(--text);
  }
  .typing {
    display: flex;
    gap: 5px;
    align-self: flex-start;
    padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red-dim);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; background: var(--red-glow); }
  }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--red-dim);
  }
  input, textarea {
    flex: 1;
    background: var(--bg-panel);
    border: 1px solid var(--red-dim);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: none;
    max-height: 120px;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--red-glow);
    box-shadow: 0 0 8px rgba(220,38,38,0.35);
  }
  button {
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .attach-icons {
    display: flex;
    gap: 12px;
    align-items: center;
    color: var(--text-dim);
    padding: 0 2px;
  }
  .attach-icons svg { width: 20px; height: 20px; }
  button:hover:not(:disabled) { box-shadow: 0 0 10px rgba(220,38,38,0.5); }
  button:disabled { background: var(--red-dim); cursor: default; }

  #authScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 30px;
  }
  #authScreen h2 {
    color: var(--red-glow);
    letter-spacing: 0.1em;
    font-size: 16px;
    text-shadow: 0 0 10px rgba(220,38,38,0.5);
    margin: 0 0 6px;
  }
  .auth-form {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .auth-form input {
    width: 100%;
  }
  .auth-form button {
    padding: 12px;
  }
  .auth-toggle {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    cursor: pointer;
    text-decoration: underline;
  }
  .auth-error {
    color: var(--red-glow);
    font-size: 13px;
    text-align: center;
  }
  .auth-hint {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    max-width: 300px;
  }

  /* Sidebar */
  #sidebarOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 40;
    display: none;
  }
  #sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 260px;
    max-width: 80vw;
    height: 100%;
    background: var(--bg-panel);
    border-right: 1px solid var(--red-dim);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebarOverlay.open { display: block; }
  .sidebar-title {
    color: var(--red-glow);
    letter-spacing: 0.1em;
    font-size: 14px;
    margin-bottom: 16px;
    text-shadow: 0 0 10px rgba(220,38,38,0.5);
  }
  .new-chat-btn {
    width: 100%;
    padding: 10px;
    margin-bottom: 16px;
    border-radius: 8px;
  }
  #conversationList {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .convo-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-dim);
  }
  .convo-item:hover, .convo-item.active {
    background: rgba(220,38,38,0.1);
    color: var(--text);
  }
  .convo-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .convo-delete {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 2px 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .convo-delete:hover { color: var(--red-glow); }

  /* Message controls */
  .msg-wrap { display: flex; flex-direction: column; gap: 4px; max-width: 90%; }
  .msg-wrap.user { align-self: flex-end; }
  .msg-wrap.ultron { align-self: flex-start; }
  .msg-controls {
    display: flex;
    gap: 10px;
    opacity: 0.6;
  }
  .msg-wrap.user .msg-controls { justify-content: flex-end; }
  .msg-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    padding: 2px 4px;
    font-family: inherit;
  }
  .msg-btn:hover { color: var(--red-glow); }
  .msg-editing textarea {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--red-glow);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 10px;
    resize: none;
  }
  .msg-edit-actions { display: flex; gap: 8px; margin-top: 6px; }
  .msg-edit-actions button { padding: 6px 14px; font-size: 12px; }
</style>
</head>
<body>
<div id="sidebarOverlay"></div>
<div id="sidebar">
  <div class="sidebar-title">ULTRON</div>
  <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
  <div id="conversationList"></div>
</div>
<div id="app">
  <header>
    <div class="header-left">
      <div class="hamburger"><span></span><span></span><span></span></div>
      <div class="dot"></div>
      <h1>ULTRON ONLINE</h1>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="header-time" id="headerTime"></div>
      <button class="signout-btn" id="signOutBtn" style="display:none;">Sign out</button>
    </div>
  </header>

  <div id="authScreen">
    <h2 id="authTitle">CREATE ACCOUNT</h2>
    <form class="auth-form" id="signUpForm">
      <input type="email" id="signUpEmail" placeholder="Email" required autocomplete="email" />
      <input type="password" id="signUpPassword" placeholder="Password (min 6 characters)" required autocomplete="new-password" />
      <button type="submit">Sign Up</button>
      <div class="auth-error" id="signUpError"></div>
    </form>

    <form class="auth-form" id="loginForm" style="display:none;">
      <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email" />
      <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password" />
      <button type="submit">Log In</button>
      <div class="auth-error" id="loginError"></div>
    </form>

    <form class="auth-form" id="verifyForm" style="display:none;">
      <p class="auth-hint">A verification code was sent to your email. Enter it below to activate your account.</p>
      <input type="text" id="verifyCode" placeholder="6-digit code" inputmode="numeric" required />
      <button type="submit">Verify</button>
      <div class="auth-error" id="verifyError"></div>
    </form>

    <div class="auth-toggle" id="authToggle">Already have an account? Log in</div>
  </div>

  <div id="hero" style="display:none;">
    <div class="core-wrap">
      <div class="core-ring ring1"></div>
      <div class="core-ring ring2"></div>
      <div class="core"></div>
    </div>
    <h2>ULTRON ONLINE</h2>
    <p>I am operational. State your query, and I shall respond.</p>
  </div>

  <div id="log" style="display:none;"></div>

  <form id="form" style="display:none;">
    <div class="attach-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
    </div>
    <textarea id="input" rows="1" placeholder="State your query..."></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const SUPABASE_URL = "https://tizlgigelvnlbjftdrpz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_mTKce1Me02eRrXLe0P75cQ_Xwni7uKh";

  if (typeof window.supabase === 'undefined') {
    document.body.innerHTML = '<div style="color:#ff3b3b; padding:30px; font-family:monospace;">ERROR: Supabase library failed to load. Check your internet connection or the script tag in index.html.</div>';
    throw new Error('Supabase library not loaded');
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const log = document.getElementById('log');
  const hero = document.getElementById('hero');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const headerTime = document.getElementById('headerTime');
  const signOutBtn = document.getElementById('signOutBtn');

  const authScreen = document.getElementById('authScreen');
  const authTitle = document.getElementById('authTitle');
  const signUpForm = document.getElementById('signUpForm');
  const loginForm = document.getElementById('loginForm');
  const verifyForm = document.getElementById('verifyForm');
  const authToggle = document.getElementById('authToggle');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const hamburger = document.querySelector('.hamburger');
  const newChatBtn = document.getElementById('newChatBtn');
  const conversationList = document.getElementById('conversationList');

  let history = [];
  let pendingEmail = '';
  let showingLogin = false;
  let currentConversationId = null;
  let currentUserId = null;

  function updateClock() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const timeStr = now.toLocaleTimeString('en-US');
    headerTime.innerHTML = dateStr + '<br>' + timeStr;
  }
  updateClock();
  setInterval(updateClock, 1000);

  authToggle.addEventListener('click', () => {
    showingLogin = !showingLogin;
    signUpForm.style.display = showingLogin ? 'none' : 'flex';
    loginForm.style.display = showingLogin ? 'flex' : 'none';
    verifyForm.style.display = 'none';
    authTitle.textContent = showingLogin ? 'LOG IN' : 'CREATE ACCOUNT';
    authToggle.textContent = showingLogin ? "Don't have an account? Sign up" : 'Already have an account? Log in';
  });

  signUpForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('signUpEmail').value.trim();
    const password = document.getElementById('signUpPassword').value;
    const errorDiv = document.getElementById('signUpError');
    errorDiv.textContent = '';

    const { error } = await sb.auth.signUp({ email, password });
    if (error) {
      errorDiv.textContent = error.message;
      return;
    }
    pendingEmail = email;
    signUpForm.style.display = 'none';
    loginForm.style.display = 'none';
    authToggle.style.display = 'none';
    verifyForm.style.display = 'flex';
    authTitle.textContent = 'VERIFY EMAIL';
  });

  verifyForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('verifyCode').value.trim();
    const errorDiv = document.getElementById('verifyError');
    errorDiv.textContent = '';

    const { error } = await sb.auth.verifyOtp({
      email: pendingEmail,
      token: code,
      type: 'signup',
    });
    if (error) {
      errorDiv.textContent = error.message;
      return;
    }
    enterApp();
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('loginError');
    errorDiv.textContent = '';

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errorDiv.textContent = error.message;
      return;
    }
    enterApp();
  });

  signOutBtn.addEventListener('click', async () => {
    await sb.auth.signOut();
    location.reload();
  });

  function enterApp() {
    authScreen.style.display = 'none';
    hero.style.display = 'flex';
    form.style.display = 'flex';
    signOutBtn.style.display = 'inline-block';
    sb.auth.getUser().then(({ data: { user } }) => {
      currentUserId = user.id;
      loadConversationList();
    });
  }

  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) enterApp();
  });

  // --- Sidebar ---
  hamburger.addEventListener('click', () => {
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('open');
  });
  sidebarOverlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
  });

  newChatBtn.addEventListener('click', () => {
    currentConversationId = null;
    history = [];
    messageDivs = [];
    log.innerHTML = '';
    log.style.display = 'none';
    hero.style.display = 'flex';
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
    renderConversationList();
  });

  let conversationsCache = [];

  async function loadConversationList() {
    const { data, error } = await sb
      .from('conversations')
      .select('id, title, updated_at')
      .order('updated_at', { ascending: false });
    if (error) return;
    conversationsCache = data || [];
    renderConversationList();
  }

  function renderConversationList() {
    conversationList.innerHTML = '';
    conversationsCache.forEach((convo) => {
      const item = document.createElement('div');
      item.className = 'convo-item' + (convo.id === currentConversationId ? ' active' : '');
      const titleSpan = document.createElement('span');
      titleSpan.className = 'convo-title';
      titleSpan.textContent = convo.title || 'New conversation';
      const delBtn = document.createElement('button');
      delBtn.className = 'convo-delete';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('Delete this conversation?')) return;
        await sb.from('conversations').delete().eq('id', convo.id);
        if (convo.id === currentConversationId) {
          currentConversationId = null;
          history = [];
          messageDivs = [];
          log.innerHTML = '';
          log.style.display = 'none';
          hero.style.display = 'flex';
        }
        loadConversationList();
      });
      item.appendChild(titleSpan);
      item.appendChild(delBtn);
      item.addEventListener('click', () => openConversation(convo.id));
      conversationList.appendChild(item);
    });
  }

  async function openConversation(id) {
    const { data, error } = await sb
      .from('messages')
      .select('id, role, content')
      .eq('conversation_id', id)
      .order('created_at', { ascending: true });
    if (error) return;

    currentConversationId = id;
    history = data.map((m) => ({ role: m.role, content: m.content }));
    messageDivs = [];
    log.innerHTML = '';
    hero.style.display = 'none';
    log.style.display = 'flex';
    data.forEach((m) => {
      const { wrap } = addHistoryMessage(m.content, m.role === 'user' ? 'user' : 'ultron');
      messageDivs[messageDivs.length - 1].dbId = m.id;
    });
    refreshMessageControls();
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
    renderConversationList();
  }

  async function ensureConversation(firstMessageText) {
    if (currentConversationId) return currentConversationId;
    const title = firstMessageText.slice(0, 40) + (firstMessageText.length > 40 ? '…' : '');
    const { data, error } = await sb
      .from('conversations')
      .insert({ user_id: currentUserId, title })
      .select()
      .single();
    if (error) {
      alert('DB ERROR (conversation): ' + error.message);
      return null;
    }
    currentConversationId = data.id;
    conversationsCache.unshift({ id: data.id, title, updated_at: new Date().toISOString() });
    renderConversationList();
    return currentConversationId;
  }

  async function saveMessage(conversationId, role, content) {
    if (!conversationId) return null;
    const { data, error: e1 } = await sb.from('messages').insert({ conversation_id: conversationId, role, content }).select().single();
    if (e1) { alert('DB ERROR (message): ' + e1.message); return null; }
    const { error: e2 } = await sb.from('conversations').update({ updated_at: new Date().toISOString() }).eq('id', conversationId);
    if (e2) alert('DB ERROR (update): ' + e2.message);
    return data ? data.id : null;
  }

  function showChat() {
    if (hero.style.display !== 'none') {
      hero.style.display = 'none';
      log.style.display = 'flex';
      addMessage('I am present. State your inquiry.', 'ultron');
    }
  }

  let messageDivs = []; // parallel to history: { wrap, bubble, role, dbId }

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'ultron');
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function addHistoryMessage(text, role) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + (role === 'user' ? 'user' : 'ultron');

    const bubble = document.createElement('div');
    bubble.className = 'msg ' + (role === 'user' ? 'user' : 'ultron');
    bubble.textContent = text;

    const controls = document.createElement('div');
    controls.className = 'msg-controls';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'msg-btn';
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(bubble.textContent);
      copyBtn.textContent = 'Copied';
      setTimeout(() => (copyBtn.textContent = 'Copy'), 1200);
    });
    controls.appendChild(copyBtn);

    if (role === 'user') {
      const editBtn = document.createElement('button');
      editBtn.className = 'msg-btn edit-btn';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => startEdit(wrap, bubble, controls));
      controls.appendChild(editBtn);
    } else {
      const regenBtn = document.createElement('button');
      regenBtn.className = 'msg-btn regen-btn';
      regenBtn.textContent = 'Regenerate';
      regenBtn.addEventListener('click', () => doRegenerate());
      controls.appendChild(regenBtn);
    }

    wrap.appendChild(bubble);
    wrap.appendChild(controls);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;

    messageDivs.push({ wrap, bubble, role, dbId: null });
    refreshMessageControls();
    return { wrap, bubble };
  }

  function refreshMessageControls() {
    document.querySelectorAll('.edit-btn').forEach((b) => (b.style.display = 'none'));
    document.querySelectorAll('.regen-btn').forEach((b) => (b.style.display = 'none'));
    for (let i = messageDivs.length - 1; i >= 0; i--) {
      if (messageDivs[i].role === 'user') {
        const btn = messageDivs[i].wrap.querySelector('.edit-btn');
        if (btn) btn.style.display = 'inline-block';
        break;
      }
    }
    if (messageDivs.length > 0 && messageDivs[messageDivs.length - 1].role === 'ultron') {
      const btn = messageDivs[messageDivs.length - 1].wrap.querySelector('.regen-btn');
      if (btn) btn.style.display = 'inline-block';
    }
  }

  function startEdit(wrap, bubble, controls) {
    const original = bubble.textContent;
    wrap.classList.add('msg-editing');
    bubble.style.display = 'none';
    controls.style.display = 'none';

    const textarea = document.createElement('textarea');
    textarea.rows = 2;
    textarea.value = original;

    const actions = document.createElement('div');
    actions.className = 'msg-edit-actions';
    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.textContent = 'Save & Resend';
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.style.background = 'var(--red-dim)';
    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);

    wrap.appendChild(textarea);
    wrap.appendChild(actions);

    cancelBtn.addEventListener('click', () => {
      wrap.removeChild(textarea);
      wrap.removeChild(actions);
      bubble.style.display = '';
      controls.style.display = '';
      wrap.classList.remove('msg-editing');
    });

    saveBtn.addEventListener('click', async () => {
      const newText = textarea.value.trim();
      if (!newText) return;
      await submitEditedMessage(newText);
    });
  }

  async function submitEditedMessage(newText) {
    // Find the index of the last user message (the one being edited)
    let idx = -1;
    for (let i = messageDivs.length - 1; i >= 0; i--) {
      if (messageDivs[i].role === 'user') { idx = i; break; }
    }
    if (idx === -1) return;

    // Delete this message and everything after it, from DOM, history, and DB
    const toDelete = messageDivs.slice(idx);
    const idsToDelete = toDelete.map((m) => m.dbId).filter(Boolean);
    if (idsToDelete.length > 0 && currentConversationId) {
      await sb.from('messages').delete().in('id', idsToDelete);
    }
    toDelete.forEach((m) => m.wrap.remove());
    messageDivs = messageDivs.slice(0, idx);
    history = history.slice(0, idx);

    await sendUserMessage(newText);
  }

  async function doRegenerate() {
    if (messageDivs.length === 0) return;
    const last = messageDivs[messageDivs.length - 1];
    if (last.role !== 'ultron') return;

    if (last.dbId && currentConversationId) {
      await sb.from('messages').delete().eq('id', last.dbId);
    }
    last.wrap.remove();
    messageDivs.pop();
    history.pop();

    sendBtn.disabled = true;
    const typing = addTyping();
    try {
      const currentDateTime = new Date().toString();
      const res = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, currentDateTime }),
      });
      const data = await res.json();
      typing.remove();
      if (data.error) {
        addMessage('System fault: ' + data.error, 'ultron');
      } else {
        const { bubble } = addHistoryMessage('', 'ultron');
        await revealGradually(bubble, data.reply);
        history.push({ role: 'assistant', content: data.reply });
        const dbId = await saveMessage(currentConversationId, 'assistant', data.reply);
        messageDivs[messageDivs.length - 1].dbId = dbId;
        refreshMessageControls();
      }
    } catch (err) {
      typing.remove();
      addMessage('Connection to core severed. Retry.', 'ultron');
    }
    sendBtn.disabled = false;
  }

  function revealGradually(div, fullText) {
    return new Promise((resolve) => {
      const words = fullText.split(' ');
      let i = 0;
      div.textContent = '';
      const interval = setInterval(() => {
        div.textContent += (i === 0 ? '' : ' ') + words[i];
        log.scrollTop = log.scrollHeight;
        i++;
        if (i >= words.length) {
          clearInterval(interval);
          resolve();
        }
      }, 35);
    });
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    await sendUserMessage(text);
  });

  async function sendUserMessage(text) {
    showChat();
    const { bubble: userBubble } = addHistoryMessage(text, 'user');
    history.push({ role: 'user', content: text });
    sendBtn.disabled = true;

    const convoId = await ensureConversation(text);
    const userDbId = await saveMessage(convoId, 'user', text);
    messageDivs[messageDivs.length - 1].dbId = userDbId;
    refreshMessageControls();

    const typing = addTyping();

    try {
      const currentDateTime = new Date().toString();
      const res = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, currentDateTime }),
      });
      const data = await res.json();
      typing.remove();

      if (data.error) {
        addMessage('System fault: ' + data.error, 'ultron');
      } else {
        const { bubble } = addHistoryMessage('', 'ultron');
        await revealGradually(bubble, data.reply);
        history.push({ role: 'assistant', content: data.reply });
        const assistantDbId = await saveMessage(convoId, 'assistant', data.reply);
        messageDivs[messageDivs.length - 1].dbId = assistantDbId;
        refreshMessageControls();
      }
    } catch (err) {
      typing.remove();
      addMessage('Connection to core severed. Retry.', 'ultron');
    }

    sendBtn.disabled = false;
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
</body>
</html>
