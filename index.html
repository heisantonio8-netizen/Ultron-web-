<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ultron</title>
<style>
  :root {
    --bg: #0a0000;
    --bg-panel: #120303;
    --red: #dc2626;
    --red-dim: #7f1d1d;
    --text: #e8e0e0;
    --text-dim: #8a7373;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', ui-monospace, monospace;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--red-dim);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }
  header h1 {
    font-size: 15px;
    letter-spacing: 0.12em;
    margin: 0;
    color: var(--red);
    font-weight: 600;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .msg { max-width: 90%; line-height: 1.55; font-size: 15px; white-space: pre-wrap; }
  .msg.user {
    align-self: flex-end;
    background: rgba(220, 38, 38, 0.12);
    border: 1px solid var(--red-dim);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .msg.ultron {
    align-self: flex-start;
    color: var(--text);
  }
  .msg.ultron.thinking { color: var(--text-dim); font-style: italic; }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--red-dim);
  }
  input {
    flex: 1;
    background: var(--bg-panel);
    border: 1px solid var(--red-dim);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--red); }
  button {
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  button:disabled { background: var(--red-dim); cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="dot"></div>
    <h1>ULTRON ONLINE</h1>
  </header>
  <div id="log">
    <div class="msg ultron">I am present. State your inquiry.</div>
  </div>
  <form id="form">
    <input id="input" type="text" placeholder="State your query..." autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let history = [];

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'ultron');
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });
    input.value = '';
    sendBtn.disabled = true;

    const thinking = addMessage('Processing...', 'ultron');
    thinking.classList.add('thinking');

    try {
      const currentDateTime = new Date().toString();
      const res = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, currentDateTime }),
      });
      const data = await res.json();
      thinking.remove();

      if (data.error) {
        addMessage('System fault: ' + data.error, 'ultron');
      } else {
        addMessage(data.reply, 'ultron');
        history.push({ role: 'assistant', content: data.reply });
      }
    } catch (err) {
      thinking.remove();
      addMessage('Connection to core severed. Retry.', 'ultron');
    }

    sendBtn.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
