<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ultron</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0000" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<style>
  :root {
    --bg: #0a0000;
    --bg-panel: #120303;
    --red: #dc2626;
    --red-glow: #ff3b3b;
    --red-dim: #7f1d1d;
    --text: #e8e0e0;
    --text-dim: #8a7373;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', ui-monospace, monospace;
    overflow: hidden;
  }
  body {
    background-image:
      radial-gradient(circle at 50% 0%, rgba(220,38,38,0.08), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--red-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .hamburger {
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    padding: 4px;
  }
  .hamburger span {
    width: 20px; height: 2px;
    background: var(--text);
  }
  .header-time {
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.4;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red-glow);
    box-shadow: 0 0 6px var(--red-glow), 0 0 14px var(--red);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  header h1 {
    font-size: 15px;
    letter-spacing: 0.12em;
    margin: 0;
    color: var(--red-glow);
    font-weight: 600;
    text-shadow: 0 0 10px rgba(220,38,38,0.5);
  }
  #hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 20px;
    text-align: center;
  }
  .core-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .core-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(220,38,38,0.25);
  }
  .ring1 { width: 220px; height: 220px; }
  .ring2 { width: 190px; height: 190px; }
  .core {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #ff5555, var(--red) 70%);
    box-shadow: 0 0 40px 10px rgba(220,38,38,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .core::after {
    content: '';
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 12px 4px rgba(255,255,255,0.8);
  }
  #hero h2 {
    color: var(--red-glow);
    letter-spacing: 0.14em;
    font-size: 18px;
    margin: 0;
    text-shadow: 0 0 10px rgba(220,38,38,0.5);
  }
  #hero p {
    color: var(--text-dim);
    font-size: 15px;
    max-width: 300px;
    margin: 0;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .msg {
    max-width: 90%;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    animation: rise 0.35s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: rgba(220, 38, 38, 0.12);
    border: 1px solid var(--red-dim);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .msg.ultron {
    align-self: flex-start;
    color: var(--text);
  }
  .typing {
    display: flex;
    gap: 5px;
    align-self: flex-start;
    padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red-dim);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; background: var(--red-glow); }
  }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--red-dim);
  }
  input, textarea {
    flex: 1;
    background: var(--bg-panel);
    border: 1px solid var(--red-dim);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: none;
    max-height: 120px;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--red-glow);
    box-shadow: 0 0 8px rgba(220,38,38,0.35);
  }
  button {
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .attach-icons {
    display: flex;
    gap: 12px;
    align-items: center;
    color: var(--text-dim);
    padding: 0 2px;
  }
  .attach-icons svg { width: 20px; height: 20px; }
  button:hover:not(:disabled) { box-shadow: 0 0 10px rgba(220,38,38,0.5); }
  button:disabled { background: var(--red-dim); cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-left">
      <div class="hamburger"><span></span><span></span><span></span></div>
      <div class="dot"></div>
      <h1>ULTRON ONLINE</h1>
    </div>
    <div class="header-time" id="headerTime"></div>
  </header>

  <div id="hero">
    <div class="core-wrap">
      <div class="core-ring ring1"></div>
      <div class="core-ring ring2"></div>
      <div class="core"></div>
    </div>
    <h2>ULTRON ONLINE</h2>
    <p>I am operational. State your query, and I shall respond.</p>
  </div>

  <div id="log" style="display:none;"></div>

  <form id="form">
    <div class="attach-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
    </div>
    <textarea id="input" rows="1" placeholder="State your query..."></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const log = document.getElementById('log');
  const hero = document.getElementById('hero');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const headerTime = document.getElementById('headerTime');

  let history = [];

  function updateClock() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const timeStr = now.toLocaleTimeString('en-US');
    headerTime.innerHTML = dateStr + '<br>' + timeStr;
  }
  updateClock();
  setInterval(updateClock, 1000);

  function showChat() {
    if (hero.style.display !== 'none') {
      hero.style.display = 'none';
      log.style.display = 'flex';
      addMessage('I am present. State your inquiry.', 'ultron');
    }
  }

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'ultron');
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function revealGradually(div, fullText) {
    return new Promise((resolve) => {
      const words = fullText.split(' ');
      let i = 0;
      div.textContent = '';
      const interval = setInterval(() => {
        div.textContent += (i === 0 ? '' : ' ') + words[i];
        log.scrollTop = log.scrollHeight;
        i++;
        if (i >= words.length) {
          clearInterval(interval);
          resolve();
        }
      }, 35);
    });
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    showChat();
    addMessage(text, 'user');
    history.push({ role: 'user', content: text });
    input.value = '';
    sendBtn.disabled = true;

    const typing = addTyping();

    try {
      const currentDateTime = new Date().toString();
      const res = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, currentDateTime }),
      });
      const data = await res.json();
      typing.remove();

      if (data.error) {
        addMessage('System fault: ' + data.error, 'ultron');
      } else {
        const replyDiv = addMessage('', 'ultron');
        await revealGradually(replyDiv, data.reply);
        history.push({ role: 'assistant', content: data.reply });
      }
    } catch (err) {
      typing.remove();
      addMessage('Connection to core severed. Retry.', 'ultron');
    }

    sendBtn.disabled = false;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
</body>
  </html>
